<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANDOR OSP: H01 C hero mock</title>
<!--
  H01 C as a website hero. The renders are clean plates (no type baked in); the headline, the line and the
  call to action are native HTML on top, so they stay sharp, translatable, editable and accessible.
  Copy is a placeholder.

  Two compositions, chosen by the browser (art direction with <picture>):
  - portrait screens (phones; up to 4:5): H01_C_R4_mobile, rendered natively in portrait. The instrument
    spans the width in the lower half; the upper half is clean ivory for the copy;
  - everything wider (tablets in landscape, laptops, desktops): H01_C_R4, 16:9. object-fit: cover crops it
    to the screen, keeping the instrument in view (object-position below).
  Each comes in several widths (srcset) and in WebP with a JPEG fallback; the browser picks the smallest
  file that is sharp on the device.
-->
<style>
  @font-face { font-family: "EB Garamond"; src: url("../typography/fonts/EBGaramond-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Inter Tight"; font-weight: 760; src: url("../typography/fonts/InterTight-760.ttf") format("truetype"); }
  @font-face { font-family: "Inter Tight"; font-weight: 300; src: url("../typography/fonts/InterTight-300.ttf") format("truetype"); }
  :root { --text: #242723; --text-2: #5c635a; --plate: #cfc8bf; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--plate); color: var(--text); font-family: "Inter Tight", system-ui, sans-serif; }
  .hero { position: relative; min-height: 100svh; overflow: hidden; display: grid; }
  .hero picture, .hero img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero img { object-fit: cover; object-position: 50% 62%; }
  .copy { position: relative; z-index: 1; align-self: start; justify-self: center; text-align: center;
          padding: clamp(40px, 7vh, 88px) 16px 0; }
  h1 { font-family: "EB Garamond", Georgia, serif; font-weight: 400; letter-spacing: -0.01em;
       font-size: clamp(34px, 4.4vw, 68px); line-height: 1.06; }
  p { margin-top: 14px; font-weight: 300; font-size: clamp(15px, 1.25vw, 19px); color: var(--text-2); }
  .cta { display: inline-block; margin-top: 26px; padding: 13px 26px; border-radius: 999px; background: var(--text);
         color: #f6f2ec; font-weight: 760; font-size: 15px; letter-spacing: 0.01em; text-decoration: none; }
  @media (max-aspect-ratio: 4/5) {
    .hero img { object-position: 50% 60%; }
    .copy { padding-top: clamp(44px, 10vh, 120px); max-width: 30em; }
    h1 { font-size: clamp(30px, 9.4vw, 52px); }        /* two lines down to a 320 px wide phone */
    p { font-size: clamp(14px, 3.9vw, 17px); margin-top: 12px; }
    .cta { margin-top: 20px; padding: 13px 26px; font-size: 16px; }
  }
  /* shorter phones (iPhone SE and other 9:16 screens): the plate is cropped less at the bottom, so the
     instrument sits lower and clear of the button */
  @media (max-aspect-ratio: 4/5) and (min-aspect-ratio: 9/17) {
    .hero img { object-position: 50% 8%; }
    .copy { padding-top: clamp(32px, 7vh, 64px); }
  }
</style>
</head>
<body>
  <section class="hero" aria-label="ANDOR OSP">
    <picture>
      <source media="(max-aspect-ratio: 4/5)" type="image/webp"
              srcset="img/H01_C_R4_mobile_860w.webp 860w, img/H01_C_R4_mobile_1290w.webp 1290w" sizes="100vw">
      <source media="(max-aspect-ratio: 4/5)"
              srcset="img/H01_C_R4_mobile_860w.jpg 860w, img/H01_C_R4_mobile_1290w.jpg 1290w" sizes="100vw">
      <source type="image/webp"
              srcset="img/H01_C_R4_desktop_1920w.webp 1920w, img/H01_C_R4_desktop_2560w.webp 2560w, img/H01_C_R4_desktop_3840w.webp 3840w" sizes="100vw">
      <img id="plate" src="img/H01_C_R4_desktop_1920w.jpg"
           srcset="img/H01_C_R4_desktop_1920w.jpg 1920w, img/H01_C_R4_desktop_2560w.jpg 2560w, img/H01_C_R4_desktop_3840w.jpg 3840w" sizes="100vw"
           alt="ANDOR OSP instrument, seen from the front on an ivory backdrop">
    </picture>
    <div class="copy">
      <h1>One sound.<br>An entire instrument.</h1>
      <p>ANDOR OSP turns a single recording into a playable instrument.</p>
      <a class="cta" href="#beta">Join the beta</a>
    </div>
  </section>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANDOR OSP: H01 C hero mock</title>
<!--
  H01 C as a website hero: the render is a clean plate (no type baked in); the headline and the call to
  action are native HTML on top of it, so they stay sharp, translatable, editable and accessible.
  The plate leaves its top band as plain ivory for them. Copy is a placeholder.
  ?plate=<file> swaps the image (default: H01_C_R4_plate.jpg beside this file).
-->
<style>
  @font-face { font-family: "EB Garamond"; src: url("../typography/fonts/EBGaramond-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Inter Tight"; font-weight: 760; src: url("../typography/fonts/InterTight-760.ttf") format("truetype"); }
  @font-face { font-family: "Inter Tight"; font-weight: 300; src: url("../typography/fonts/InterTight-300.ttf") format("truetype"); }
  :root { --text: #242723; --text-2: #5c635a; --plate: #cfc8bf; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--plate); color: var(--text); font-family: "Inter Tight", system-ui, sans-serif; }
  .hero { position: relative; min-height: 100svh; overflow: hidden; display: grid; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; }
  .copy { position: relative; z-index: 1; align-self: start; justify-self: center; text-align: center;
          padding: clamp(40px, 7vh, 88px) 16px 0; }
  h1 { font-family: "EB Garamond", Georgia, serif; font-weight: 400; letter-spacing: -0.01em;
       font-size: clamp(34px, 4.4vw, 68px); line-height: 1.06; }
  p { margin-top: 14px; font-weight: 300; font-size: clamp(15px, 1.25vw, 19px); color: var(--text-2); }
  .cta { display: inline-block; margin-top: 26px; padding: 13px 26px; border-radius: 999px; background: var(--text);
         color: #f6f2ec; font-weight: 760; font-size: 15px; letter-spacing: 0.01em; text-decoration: none; }
</style>
</head>
<body>
  <section class="hero" aria-label="ANDOR OSP">
    <img id="plate" src="H01_C_R4_plate.jpg" alt="ANDOR OSP instrument, seen from the front on an ivory backdrop">
    <div class="copy">
      <h1>One sound.<br>An entire instrument.</h1>
      <p>ANDOR OSP turns a single recording into a playable instrument.</p>
      <a class="cta" href="#beta">Join the beta</a>
    </div>
  </section>
  <script>
    const q = new URLSearchParams(location.search).get("plate");
    if (q) document.getElementById("plate").src = q;
  </script>
</body>
</html>

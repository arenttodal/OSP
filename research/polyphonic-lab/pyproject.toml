[project]
name = "polyphonic-lab"
version = "0.1.0"
description = "ANDOR OSP Polyphonic Instrument Extraction Lab (research only, not part of the plugin)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "mir_eval>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
osp-poly = "polyphonic_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polyphonic_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ANDOR OSP: everything product-specific the ANDOR release scripts need (packaging/release).
# Sourced by bash; paths are relative to the repository root. Another ANDOR product (ANALOG,
# Modular) keeps a file like this beside its own sources and runs the same scripts with it.
#
# Identity: never change these for branding. Hosts find OSP by them; changing any of them
# makes every saved DAW project lose the instrument.
PRODUCT_ID="andor-osp"                  # release manifests, file names, update channels
PRODUCT_NAME="ANDOR OSP"                # what the installer and the release notes say
PRODUCT_FILE_STEM="ANDOR-OSP"           # ANDOR-OSP-<version>-macOS-universal.pkg
BUNDLE_ID="com.osp.instrument"          # CFBundleIdentifier of all three bundles (JUCE: BUNDLE_ID)
AU_TYPE="aumu"                          # kAudioUnitType_MusicDevice
AU_SUBTYPE="Osp1"                       # PLUGIN_CODE
AU_MANUFACTURER="Ospx"                  # PLUGIN_MANUFACTURER_CODE

VERSION_FILE="packaging/release/products/osp/version.env"
CHANGELOG_FILE="packaging/release/products/osp/CHANGELOG.md"
INSTALLER_RESOURCES="packaging/release/products/osp/installer"

# The build: a fresh universal Release, customer configuration (no factory authoring).
CMAKE_ARGS=(
    -DCMAKE_BUILD_TYPE=Release
    -DOSP_BUILD_PLUGIN=ON
    -DOSP_BUILD_TESTS=ON
    -DOSP_FACTORY_AUTHORING=OFF
)
# CMake cache entries that must hold these values in a customer build (checked after configure).
REQUIRED_CACHE=(
    "OSP_FACTORY_AUTHORING:BOOL=OFF"
    "CMAKE_BUILD_TYPE:STRING=Release"
)
CMAKE_GIT_SHA_VAR="OSP_GIT_SHA"          # passed -D<var>=<commit> so the About panel names it
FACTORY_FETCH="packaging/factory-packs/fetch.sh"   # run before configuring (verifies SHA-256s)
ARTEFACTS="apps/plugin/OSP_Plugin_artefacts/Release"   # inside the build directory

# The installer's components. One line each, fields separated by '|':
#   choice id | bundle (inside ARTEFACTS) | install location | package identifier | title |
#   entitlements file (or -) | description
# Package identifiers are the ones scripts/package-macos.sh used; keep them so pkgutil sees
# one product across releases.
COMPONENTS=(
    "au|AU/OSP.component|/Library/Audio/Plug-Ins/Components|com.osp.instrument.au|Audio Unit (AU)|-|For Logic Pro, GarageBand, MainStage and other AU hosts."
    "vst3|VST3/OSP.vst3|/Library/Audio/Plug-Ins/VST3|com.osp.instrument.vst3|VST3|-|For Ableton Live, Cubase, Studio One, REAPER, Bitwig and other VST3 hosts."
    "app|Standalone/OSP.app|/Applications|com.osp.instrument.app|Standalone app|packaging/macos/OSP-Standalone.entitlements|OSP on its own, without a DAW. Records from your audio input (RECORD and GRAB)."
)
# The standalone needs the microphone: its Info.plist must say why, and its entitlements must
# grant it (hardened runtime).
MIC_BUNDLE="Standalone/OSP.app"
MIC_ENTITLEMENT="com.apple.security.device.audio-input"

# Earlier unsigned test builds installed per user (packaging/macos-test/install.command). The
# installer offers, unticked, to move these aside (never delete) so hosts do not find two OSPs.
# Paths are relative to the console user's home.
LEGACY_USER_PATHS=(
    "Library/Audio/Plug-Ins/Components/OSP.component"
    "Library/Audio/Plug-Ins/VST3/OSP.vst3"
    "Applications/OSP.app"
)
LEGACY_PACKAGE_ID="com.osp.instrument.previous-test-builds"

# What must never be in the shipped payload (checked on the expanded installer).
FORBIDDEN_PAYLOAD_PATTERNS=(
    '\.DS_Store$' '\.dSYM' '\.pdb$' '/\._' '\.orig$' '\.rej$' '\.swp$' '~$'
    '\.p12$' '\.p8$' '\.pem$' '\.key$' '\.mobileprovision$' '\.env$'
    '\.wav$' '\.aiff?$' '\.flac$' '\.mp3$' '\.m4a$' '\.ospstate$'
    'Memo Lab' 'research-renderer' '_tests$'
)

# Validation after installing the package (--install-test).
STANDALONE_PROCESS="OSP"
PLUGINVAL_VERSION="v1.0.4"               # Tracktion pluginval release tag (pinned)
PLUGINVAL_STRICTNESS=5

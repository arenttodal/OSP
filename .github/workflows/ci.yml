name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # on-demand test builds after [skip ci] pushes

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # macOS only (the target platform; Linux and Windows runs were dropped to save CI
        # time). The Linux steps below stay for a local or on-demand Linux job.
        include:
          - os: macos-15          # Apple Silicon: primary target (macos-14 is retired on 2 Nov 2026)
            plugin: ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev xvfb

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        # macOS builds universal binaries (Apple Silicon + Intel) so the test build runs on any Mac.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOSP_BUILD_PLUGIN=${{ matrix.plugin }} ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Memo Lab timing
        # How long a 10-second sung memo takes to become playable (MAP NOTES) and a hum (ONE SHOT).
        if: matrix.plugin == 'ON'
        run: ./build/apps/memo-lab/memo_lab_tests "[timing]"

      - name: Editor snapshot (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p snapshots
          OSP_SNAPSHOT_DIR=$PWD/snapshots xvfb-run -a ./build/apps/plugin/osp_plugin_tests "[ui]"

      - name: Benchmark
        run: |
          ./build/apps/research-renderer/research-renderer --benchmark --output-json benchmark-${{ matrix.os }}.json
          ./build/apps/research-renderer/research-renderer --benchmark --engine C --output-json benchmark-engine-c-${{ matrix.os }}.json
          ./build/apps/research-renderer/research-renderer --benchmark --engine C --voices 16 --no-retrigger --output-json benchmark-engine-c-16-${{ matrix.os }}.json

      - name: Validate AU (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/apps/plugin/OSP_Plugin_artefacts/Release/AU/OSP.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Osp1 Ospx

      - name: Validate ANDOR Example AU (macOS)
        # The product built from the ANDOR Instrument Shell is its own plugin (code Aexm).
        if: runner.os == 'macOS'
        run: |
          cp -R "build/products/andor-example/ANDOR_Example_artefacts/Release/AU/ANDOR Example.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Aexm Ospx

      - name: Package macOS test build
        if: runner.os == 'macOS'
        run: |
          out=OSP-macOS-test
          mkdir -p $out
          art=build/apps/plugin/OSP_Plugin_artefacts/Release
          cp -R $art/AU/OSP.component $art/VST3/OSP.vst3 $out/
          if [ -d "$art/Standalone/OSP.app" ]; then cp -R "$art/Standalone/OSP.app" $out/; fi
          # ANDOR Memo Lab (recordings to instruments; docs/research/memo-lab).
          memo="build/apps/memo-lab/ANDOR_Memo_Lab_artefacts/Release/ANDOR Memo Lab.app"
          if [ -d "$memo" ]; then cp -R "$memo" $out/; fi
          cp packaging/macos-test/install.command packaging/macos-test/README.txt $out/
          chmod +x $out/install.command
          lipo -info $out/OSP.component/Contents/MacOS/OSP
          ditto -c -k --keepParent $out OSP-macOS-test.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: OSP-macOS-test
          path: OSP-macOS-test.zip

      - uses: actions/upload-artifact@v4
        # The ANDOR visual regression: OSP's renders, each shell product's, the diffs and report.
        if: always() && matrix.plugin == 'ON'
        with:
          name: andor-visual-regression-${{ matrix.os }}
          path: build/andor-visual-regression/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osp-${{ matrix.os }}
          path: |
            benchmark-*.json
            snapshots/
            build/apps/plugin/OSP_Plugin_artefacts/Release/VST3/
          if-no-files-found: ignore

      - name: Unified engine costs (Phase 2 demonstrations, the grain-budget sweep, Phase 3 atlases, Phase 4 preparation)
        # The last step, so its figures are the end of the log (per scene: mean / worst block %,
        # worst block us, grains; atlases: memory, build time, lookup; Phase 4: phrase analysis
        # accuracy on the generated phrases and preparation time per stage). The Apple Silicon
        # figures can then be read without downloading artifacts; they also go to the job
        # summary. Runs even when a test failed: the figures do not depend on it.
        if: ${{ !cancelled() }}
        run: |
          r=./build/apps/research-renderer/research-renderer
          {
            for set in phase2 budget atlas; do
              $r --unified unified-$set --set $set --repeats 3 --no-audio > /dev/null
              cat unified-$set/summary.md
            done
            cat unified-atlas/atlas.md
            $r --phrase-fixtures phrase-fixtures > /dev/null
            $r --phrase-eval --backend yin-viterbi | tail -1
            $r --prepare-bench phrase-fixtures --repeat 3 --threads 1 --output-md prepare-1.md > /dev/null
            $r --prepare-bench phrase-fixtures --repeat 3 --threads 3 --output-md prepare-3.md > /dev/null
            echo "Preparation, 1 thread:"; cat prepare-1.md
            echo "Preparation, 3 threads:"; cat prepare-3.md
          } | tee unified-costs.md
          cat unified-costs.md >> "$GITHUB_STEP_SUMMARY"
